deployment:
  tasks:
    - export DEPLOYPATH=/home/zfhlm9xuevp1/greenshift.perfectwebservices.com
    - cd $DEPLOYPATH && /usr/local/bin/php /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader
